name: Docker Build — asset-registry-service

on:
  push:
    branches: [ "main" ]
    paths:
      - "asset-registry-service/**"
      - ".github/workflows/docker-build-asset-registry.yml"
    # Version tags don't build here. A release adds the version tag to an
    # image already built (see release.yml) and never moves :latest.
  pull_request:
    branches: [ "main" ]
    paths:
      - "asset-registry-service/**"
      - ".github/workflows/docker-build-asset-registry.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# ADR-0028 Phase 1: canonical writer for public.asset_registry.
# Publishes ghcr.io/edgy-solutions/openddil/asset-registry-service:latest,
# which openddil-helm/openddil-demo/templates/hub.yaml pulls by tag.
# Stack repo also hosts the schema + atlas migrations, but those don't
# need a Docker image — only this service does.
jobs:
  build-asset-registry-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :sha-<7> always, :pr-<N> on a pull request, :<tag> on a v* tag;
      # :latest only from main.
      - name: Compute image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/asset-registry-service
          T="$REG:sha-${HEAD_SHA:0:7}"
          if [ -n "$PR_NUMBER" ]; then
            T="$T,$REG:pr-$PR_NUMBER"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            T="$T,$REG:$GITHUB_REF_NAME"
          fi
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            T="$T,$REG:latest"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build asset-registry-service
        uses: docker/build-push-action@v4
        with:
          context: ./asset-registry-service
          file: ./asset-registry-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.tags.outputs.tags }}
