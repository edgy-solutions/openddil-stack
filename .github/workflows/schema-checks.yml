name: Schema checks

# Catches schema migration regressions at PR time rather than at deploy
# time. Three layers of validation:
#
#   1. Tests (pytest) — every test under tests/. Structural checks
#      (filename convention, atlas.sum integrity, chronological ordering,
#      non-empty content) need nothing. The SQL tests (for example the lk1
#      label key functions) run against the Postgres service below, reached
#      through OPENDDIL_TEST_PG_DSN. In CI a skipped test fails the job: a
#      SQL test that skips here is a silent pass.
#
#   2. Atlas semantic validation — `atlas migrate validate` replays every
#      migration on a Postgres dev database and checks SQL syntax and
#      cross-file consistency (e.g. dropping a column added in a later
#      migration).
#
#   3. Atlas lint — `atlas migrate lint` flags non-additive changes and
#      other deploy-risk patterns on the latest migration. Advisory.
#
# Postgres versions (the matrix on every job):
#   17  the deployment target. Must pass.
#   15  what the test labs run today (read from the running servers on
#       2026-11-16: 15.18 and 15.19), so a lab roll is covered too. When the
#       labs move to 17, drop 15 and the matrix is 17 alone.
# docker-compose.yml's postgres:16-alpine is neither, and is not checked.
#
# The default branch is main. Until 2026-11-15 this file triggered on
# master, so it never ran.

on:
  push:
    branches: [ "main" ]
    paths:
      - "schema/**"
      - "tests/**"
      - ".github/workflows/schema-checks.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "schema/**"
      - "tests/**"
      - ".github/workflows/schema-checks.yml"
  workflow_dispatch:

jobs:
  tests:
    name: tests (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [ "17", "15" ]
    # A throwaway database for this job only. The credentials are not a
    # secret: the service exists for the length of the job and is reachable
    # only from the runner.
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OPENDDIL_TEST_PG_DSN: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      # The SQL tests call `psql` from PATH and skip without it, and a skip
      # fails this job. Install the client of the matrix version from the
      # PostgreSQL apt repository and put it first on PATH for later steps,
      # so the client and the server are the same major version.
      - name: psql client of the matrix version
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends "postgresql-client-$PG_MAJOR"
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"
      - name: Client and server versions match the matrix
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        run: |
          command -v psql
          psql --version
          c=$(psql --version | awk '{print $3}' | cut -d. -f1)
          s=$(psql "$OPENDDIL_TEST_PG_DSN" -X -At -c "select current_setting('server_version_num')::int / 10000")
          echo "client major $c, server major $s, matrix $PG_MAJOR"
          [ "$c" = "$PG_MAJOR" ] && [ "$s" = "$PG_MAJOR" ]
          [ -n "$OPENDDIL_TEST_PG_DSN" ]
      - name: Run tests (no skips allowed)
        run: pytest tests/ -v -rs --junitxml=pytest-results.xml
      - name: Fail on skipped tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("pytest-results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"skipped={skipped}")
          raise SystemExit(1 if skipped else 0)
          PY

  atlas-validate:
    name: atlas validate (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [ "17", "15" ]
    # Atlas replays the migrations on its own dev database, so this job has
    # its own Postgres service rather than sharing the tests' database.
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: ariga/setup-atlas@v0
      - name: atlas migrate validate
        run: |
          atlas migrate validate \
            --dir file://schema/migrations \
            --dev-url "postgres://ci:ci@localhost:5432/ci?sslmode=disable"

  atlas-lint:
    name: atlas lint (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [ "17", "15" ]
    # Lint surfaces non-additive changes and other deploy-risk patterns
    # — failures here are advisory (continue-on-error), but the
    # output is preserved in the action logs so authors see what
    # they introduced.
    continue-on-error: true
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: ariga/setup-atlas@v0
      - name: atlas migrate lint (latest)
        run: |
          atlas migrate lint \
            --dir file://schema/migrations \
            --dev-url "postgres://ci:ci@localhost:5432/ci?sslmode=disable" \
            --latest 1
