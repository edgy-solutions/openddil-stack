# produces.yaml -- every Kafka topic this repo's workloads can write, as templates over the workload's environment.
# Checked against the code by asset-registry-service/src/tests/test_produces_manifest.py and against the chart by
# openddil-helm scripts/check-produces-declarations.py.
workloads:
  asset-registry:
    image: openddil/asset-registry-service
    topics:
      - "${ASSET_REGISTRY_OUTPUT_TOPIC:-asset-registry-events}"
