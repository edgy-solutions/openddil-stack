name: Notify openddil-helm to rebuild runtime-bundle

# Mirrors the openddil-contracts notify-bundle-rebuild.yml -- fires a
# repository_dispatch at openddil-helm whenever something changes in this
# repo that the runtime-bundle's Dockerfile actually COPYs in. Without this,
# a schema migration push to openddil-stack lands in the next bundle ONLY
# if some OTHER notify-bundle-rebuild firing happens to overlap in time
# (we got lucky once -- not a property to depend on).
#
# Paths filter is conservative: only the two subtrees the bundle Dockerfile
# pulls from openddil-stack ('openddil-stack/schema' -> '/bundle/stack/
# schema/', 'openddil-stack/electric' -> '/bundle/stack/electric/'). Other
# changes in this repo (asset-registry-service source, tests, the
# docker-build-asset-registry workflow itself) build the asset-registry
# image directly and don't need a bundle rebuild.
#
# Setup (one-time per repo):
#   1. Create a PAT (fine-grained) with:
#        - Repository access: edgy-solutions/openddil-helm
#        - Repository permissions: Contents = Read and write, Metadata = Read
#   2. Store it in this repo's secrets as BUNDLE_REBUILD_PAT.
#   3. openddil-helm's build-bundle.yml already has
#      `repository_dispatch: types: [source-repo-changed]` -- shared with
#      the contracts notify workflow.

# ---------------------------------------------------------------------------
# WHY THIS IS A DENY-LIST AND NOT AN ALLOW-LIST  (changed 2026-09-05, VE-9)
# ---------------------------------------------------------------------------
# It used to name the subtrees the bundle carries. That list and the bundle
# Dockerfile's `COPY` lines were two copies of one fact, in two repositories,
# with nothing comparing them — and they disagreed, repeatedly:
#
#   * `policy/` and `gateway/` were added to the bundle and not here. The
#     edit committed, CI went green, the pod restarted, and the OLD POLICY
#     KEPT RUNNING. No error appeared anywhere in that sequence, and it
#     presented as the authorizer rejecting every request rather than as a
#     stale artifact.
#   * `ontology/` had the identical gap, masked by luck — its first change
#     happened to share a commit with a watched path.
#   * `contracts/baselines` and `contracts/bootstrap` were copied into the
#     bundle and named in NO filter at all. Found by reading the Dockerfile
#     against all four filters rather than by anything failing.
#   * In the other direction, openddil-demo's list still named four files
#     the bundle stopped carrying under GD-09 — so that list was
#     simultaneously incomplete AND over-broad, while reading as
#     authoritative. Drift in both directions at once.
#
# THE TWO FAILURE MODES ARE NOT SYMMETRIC, AND THAT IS THE WHOLE ARGUMENT.
# A missed rebuild ships stale content silently, for an unbounded time, with
# every individual fact along the way still true (green CI, successful
# upgrade, Ready pod, current digest for the tag). An unnecessary rebuild
# costs about a minute of CI and is idempotent.
#
# So the filter now fails TOWARD rebuilding. Only documentation and tests are
# excluded — paths that cannot plausibly become bundle content. Everything
# else triggers, including paths added tomorrow by someone who has never read
# this file.
#
# Note what that changes about who must remember. An allow-list had to be
# updated by whoever added a bundle path — IN A DIFFERENT REPOSITORY FROM THE
# ONE THEY WERE EDITING. That is the coordination that failed twice. A
# deny-list has to be updated by whoever adds a large non-bundle directory,
# and forgetting costs a build.
#
# `paths` and `paths-ignore` are mutually exclusive in one trigger; this uses
# `paths-ignore` deliberately and must not grow a `paths` sibling.

on:
  push:
    # openddil-stack default branch is `main` (verified via `git branch -vv`
    # 2026-06-15). The other openddil-* repos use `master` -- per-repo
    # default is whatever the repo's default actually is.
    branches: [ "main" ]
    paths-ignore:
      - "tests/**"
      - "docs/**"
      - "**.md"
  # Manual button for when you want to force a dispatch without pushing
  # (e.g. testing the wiring, or kicking the bundle build after editing
  # something this paths filter doesn't catch).
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch source-repo-changed to openddil-helm
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BUNDLE_REBUILD_PAT }}
          repository: ${{ github.repository_owner }}/openddil-helm
          event-type: source-repo-changed
          # Payload is informational -- build-bundle.yml doesn't read it
          # today, but useful in Actions logs for "who triggered this".
          client-payload: |
            {
              "source_repo":  "openddil-stack",
              "ref":          "${{ github.ref }}",
              "sha":          "${{ github.sha }}",
              "actor":        "${{ github.actor }}",
              "commit_url":   "${{ github.event.head_commit.url }}"
            }
